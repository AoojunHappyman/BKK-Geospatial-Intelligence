services:
  db:
    restart: unless-stopped
    image: postgis/postgis:17-3.5
    environment:
      POSTGRES_DB: bkk
      POSTGRES_USER: bkk
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bkk -d bkk"]
      interval: 5s
      timeout: 5s
      retries: 15
  etl:
    restart: "no"
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      DATABASE_URL: postgresql://bkk:${POSTGRES_PASSWORD}@db:5432/bkk
      API_DATABASE_PASSWORD: ${API_DATABASE_PASSWORD:?Set API_DATABASE_PASSWORD in .env}
    command: ["sh", "-c", "python data-pipeline/pipeline.py && python scripts/configure_api_role.py"]
    depends_on:
      db:
        condition: service_healthy
  api:
    restart: unless-stopped
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      DATABASE_URL: postgresql://bkk_api:${API_DATABASE_PASSWORD}@db:5432/bkk
    depends_on:
      etl:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health')"]
      interval: 10s
      timeout: 5s
      retries: 10
  frontend:
    restart: unless-stopped
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports:
      - "127.0.0.1:8080:80"
    depends_on:
      api:
        condition: service_healthy
volumes:
  postgres_data:
